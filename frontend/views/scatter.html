<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>D3 Scatter Plot</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div style="padding: 20px;">
    <h2>Digitaliseringsgrad vs Medievisninger</h2>

    <label for="lokasjonFilter">Filter på lokasjon:</label>
    <select id="lokasjonFilter">
      <option value="ALL">Alle</option>
    </select>

    <div id="chartContainer" style="position: relative; width: 100%; height: 80vh;">
      <svg id="scatterPlot" width="100%" height="100%"></svg>
    </div>

    <div id="customTooltip" style="
      display: none;
      position: absolute;
      background: #fff;
      color: #000;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      pointer-events: none;
      z-index: 9999;
      font-size: 14px;
      white-space: pre-line;
    "></div>
  </div>

  <script type="module" src="/js/scatter-d3.js"></script>
</body>
</html>
