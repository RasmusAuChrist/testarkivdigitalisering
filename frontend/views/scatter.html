<head>
  <meta charset="UTF-8">
  <title>ASK - Digitaliseringsgrad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div style="padding: 20px;">
    <h2>Digitaliseringsgrad vs Gj.snitt Medievisninger</h2>

    <label for="lokasjonFilter">Filter på lokasjon:</label>
    <select id="lokasjonFilter">
      <option value="ALL">Alle</option>
    </select>

    <div style="position: relative; width: 100%; height: 80vh;">
      <canvas id="scatterCanvas" style="width: 100%; height: 100%;"></canvas>

      <div id="customTooltip" style="
        display: none;
        position: absolute;
        background: #fff;
        color: #000;
        border: 1px solid #ccc;
        padding: 8px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        pointer-events: none;
        z-index: 9999;
        font-size: 14px;
        white-space: pre-line;
      "></div>
    </div>
  </div>

  <script type="module" src="/js/scatter.js"></script>
</body>
