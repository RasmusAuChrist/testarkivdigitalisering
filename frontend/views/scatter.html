<!DOCTYPE html>
<html lang="no">
<!-- Navbar -->
  <div id="navbar-container"></div>
  <link rel="stylesheet" href="/assets/navbar.css" />
<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8">
  <title>ASK - Digitaliseringsgrad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div style="padding: 20px;">
    <h2>Digitaliseringsgrad vs Gj.snitt Medievisninger</h2>

    <label for="lokasjonFilter">Filter på lokasjon:</label>
    <select id="lokasjonFilter">
      <option value="ALL">Alle</option>
    </select>

    <div style="position: relative; width: 100%; height: 80vh;">
      <canvas id="scatterCanvas" style="width: 100%; height: 100%;"></canvas>

      <div id="customTooltip" style="
        display: none;
        position: absolute;
        background: #fff;
        color: #000;
        border: 1px solid #ccc;
        padding: 8px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        pointer-events: none;
        z-index: 9999;
        font-size: 14px;
        white-space: pre-line;
      "></div>
    </div>
  </div>

  <script type="module" src="/js/scatter.js"></script>
</body>
<script>
  fetch("/partials/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar-container").innerHTML = html;
    });
</script>
</html>
