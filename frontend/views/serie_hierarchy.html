<!DOCTYPE html>
<html lang="no">
  <div id="navbar-container"></div>
  <link rel="stylesheet" href="/assets/navbar.css" />

<head>
  <meta charset="UTF-8" />
  <title>ASK – Seriehierarki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <style>
    /* Minimal multi-select styling (plays well with your existing styles.css) */
    .ms {
      position: relative;
      background: #fff;
      border: 1px solid #cfd7df;
      border-radius: 8px;
      padding: 8px;
      min-height: 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .ms input {
      border: none;
      outline: none;
      min-width: 160px;
      flex: 1;
      font-size: 14px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef3f8;
      border: 1px solid #d7e2ee;
      font-size: 13px;
      white-space: nowrap;
    }
    .chip button {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #456;
    }
    .ms-menu {
      position: absolute;
      z-index: 50;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid #cfd7df;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      max-height: 260px;
      overflow: auto;
      display: none;
    }
    .ms-menu.open { display: block; }
    .ms-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eef1f4;
      font-size: 14px;
    }
    .ms-item:hover { background: #f5f8fb; }
    .ms-item:last-child { border-bottom: none; }
    .ms-muted {
      padding: 10px 12px;
      color: #667;
      font-size: 13px;
    }
    label { display:block; margin-bottom:6px; color:#223; font-weight:600; }
  </style>
</head>

<div id="toast" class="toast"></div>

<body>
  <div class="surface-light" style="padding:20px;">

    <h2>Seriehierarki</h2>
    <p style="color:#555;margin-top:-6px;">
      Server-side filtrering, sortering og paginering.
    </p>

    <div class="filters-dark">
      <div style="
        display:grid;
        grid-template-columns: repeat(12, 1fr);
        gap:12px;
        margin:16px 0;
        align-items:end;
      ">

        <div style="grid-column: span 4;">
          <label>Søk (fri tekst)</label>
          <input id="q" type="text" placeholder="navn / identifikator / path" style="width:100%;" />
        </div>

        <div style="grid-column: span 4;">
          <label>Identifikator (multi)</label>
          <div class="ms" id="msIdent">
            <input type="text" placeholder="Søk og velg identifikator…" />
            <div class="ms-menu"></div>
          </div>
        </div>

        <div style="grid-column: span 6;">
          <label>Navn (multi)</label>
          <div class="ms" id="msNavn">
            <input type="text" placeholder="Søk og velg navn…" />
            <div class="ms-menu"></div>
          </div>
        </div>

        <div style="grid-column: span 3;">
          <label>Startår (fra–til)</label>
          <div style="display:flex;gap:6px;">
            <input id="startaarFrom" type="number" placeholder="1975" style="width:110px;" />
            <span>–</span>
            <input id="startaarTo" type="number" placeholder="2000" style="width:110px;" />
          </div>
        </div>

        <div style="grid-column: span 3;">
          <label>Sluttår (fra–til)</label>
          <div style="display:flex;gap:6px;">
            <input id="sluttaarFrom" type="number" placeholder="1975" style="width:110px;" />
            <span>–</span>
            <input id="sluttaarTo" type="number" placeholder="2000" style="width:110px;" />
          </div>
        </div>

        <div style="grid-column: span 6; display:flex; gap:10px; align-items:end;">
          <button id="resetBtn" type="button">Nullstill filtre</button>
          <div id="stats"></div>
        </div>
      </div>
    </div>

    <div class="table-scroll-x table-scroll-x-top" id="tableScrollTop">
      <div class="table-scroll-x-spacer" id="tableScrollTopSpacer"></div>
    </div>

    <div class="table-scroll-x" id="tableScrollMain">
      <table class="arkiv-table">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div id="pagination" style="margin-top:12px;display:flex;gap:10px;align-items:center;"></div>
  </div>

  <div id="loadingOverlay">
    <img src="/assets/spinner.png" alt="Laster..." class="spinner" />
  </div>

  <script type="module" src="/js/serie_hierarchy.js"></script>

  <script>
    fetch("/partials/navbar.html")
      .then(res => res.text())
      .then(html => { document.getElementById("navbar-container").innerHTML = html; });
  </script>
</body>
</html>
