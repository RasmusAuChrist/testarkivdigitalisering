<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Arkivdetaljer – DAstats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/assets/navbar.css" />
</head>

<body>
  <div id="navbar-container"></div>

  <div class="surface-light" style="padding:20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div>
        <h2 style="margin-bottom:6px;">Arkivdetaljer</h2>
        <div id="subTitle" style="color:#555;"></div>
      </div>

      <div style="display:flex;gap:10px;">
        <button id="backBtn" type="button">← Tilbake</button>
      </div>
    </div>

    <div class="filters-dark" style="margin-top:14px;">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;">
        <div>
          <label>Serie</label>
          <div style="color:#fff;opacity:.9;">DAstats visninger per måned</div>
        </div>
        <div id="statusLine" style="margin-left:auto;color:#fff;opacity:.9;"></div>
      </div>
    </div>

    <div class="chart-box" style="margin-top:14px;height:420px;">
      <h3 style="color:#111;margin-bottom:8px;">Visningshistorikk</h3>

          <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0 10px;">
      <label style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="toggleMedia" checked />
        Media
      </label>

      <label style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="toggleDigark" checked />
        Digark
      </label>

      <label style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="toggleInternalViews" checked />
        Interne visninger
      </label>
    </div>

      <canvas id="viewsChart"></canvas>
    </div>
  </div>

  <div id="loadingOverlay">
    <img src="/assets/spinner.png" alt="Laster..." class="spinner" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="/js/arkiv_dastats_details.js"></script>

</body>
</html>
