<!DOCTYPE html>
<html lang="no">
<!-- Navbar -->
<div id="navbar"></div>

<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8" />
  <title>ASK - Arkiv oversikt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <div style="padding: 20px;">
    <h2>Arkiv oversikt</h2>
    <p style="margin-top:-8px;color:#555;">
      Filtrer på lokasjon, tags, digitaliseringsgrad og visninger. Klikk kolonneheader for sortering.
    </p>

    <!-- Filters -->
    <div style="
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      align-items: end;
      margin: 16px 0 18px 0;
    ">

      <div style="grid-column: span 3;">
        <label for="lokasjonFilter">Lokasjon</label><br />
        <select id="lokasjonFilter" style="width:100%; max-width: 320px;">
          <option value="ALL">Alle</option>
        </select>
      </div>

      <div style="grid-column: span 3;">
        <label for="tagFilter">Tag (inneholder)</label><br />
        <input id="tagFilter" type="text" placeholder="f.eks. Landssvik, Politi, 2. verdenskrig"
               style="width:100%; max-width: 420px;" />
      </div>

      <div style="grid-column: span 3;">
        <label for="searchFilter">Søk (navn/identifikator)</label><br />
        <input id="searchFilter" type="text" placeholder="f.eks. RA-S-3138"
               style="width:100%; max-width: 420px;" />
      </div>

      <div style="grid-column: span 3;">
        <label>Digitaliseringsgrad (%)</label><br />
        <div style="display:flex; gap:8px; align-items:center;">
          <input id="digMin" type="number" min="0" max="100" value="0" style="width:80px;" />
          <span>–</span>
          <input id="digMax" type="number" min="0" max="100" value="100" style="width:80px;" />
        </div>
      </div>

      <div style="grid-column: span 3;">
        <label for="minViewsMedia">Min gj.snitt visninger (Media)</label><br />
        <input id="minViewsMedia" type="number" min="0" step="0.1" value="0" style="width:160px;" />
      </div>

      <div style="grid-column: span 9; display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
        <button id="resetBtn">Nullstill filtre</button>
        <div id="stats" style="color:#555;"></div>
      </div>
    </div>

    <!-- Table -->
    <div style="overflow:auto; border:1px solid #e5e5e5; border-radius: 6px;">
      <table id="arkivTable" style="width:100%; border-collapse: collapse; min-width: 1200px;">
        <thead>
          <tr id="tableHeadRow" style="position: sticky; top: 0; background: #fafafa; z-index: 1;">
            <!-- Filled by JS -->
          </tr>
        </thead>
        <tbody id="arkivTableBody">
          <!-- Filled by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/js/arkiv.js"></script>
</body>

<script>
  fetch("../partials/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").outerHTML = html;
    });
</script>

</html>
