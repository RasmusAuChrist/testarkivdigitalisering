<!DOCTYPE html>
<html lang="no">
<!-- Navbar -->
<div id="navbar"></div>

<head>
  <meta charset="UTF-8" />
  <title>ASK – Arkivoversikt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <div style="padding:20px;">
    <h2>Arkivoversikt</h2>
    <p style="color:#555;margin-top:-6px;">
      Filtrer, sorter og bla i arkivdata.
    </p>

    <!-- Filters -->
    <div style="
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
      margin:16px 0;
      align-items:end;
    ">
      <div style="grid-column: span 3;">
        <label>Lokasjon</label><br/>
        <select id="lokasjonFilter" style="width:100%;">
          <option value="ALL">Alle</option>
        </select>
      </div>

      <div style="grid-column: span 4;">
        <label>Tags (velg én eller flere)</label><br/>
        <select id="tagsFilter" multiple size="6" style="width:100%; min-height: 150px;"></select>
        <div style="display:flex; gap:10px; margin-top:6px; flex-wrap: wrap;">
          <button id="tagsClearBtn" type="button">Tøm tags</button>
          <span id="tagsCount" style="color:#666;"></span>
        </div>
      </div>

      <div style="grid-column: span 3;">
        <label>Søk</label><br/>
        <input id="searchFilter" type="text" placeholder="Navn / identifikator" style="width:100%;" />
      </div>

      <div style="grid-column: span 2;">
        <label>Digitaliseringsgrad (%)</label><br/>
        <div style="display:flex;gap:6px;">
          <input id="digMin" type="number" value="0" style="width:80px;" />
          <span>–</span>
          <input id="digMax" type="number" value="100" style="width:80px;" />
        </div>
      </div>

      <div style="grid-column: span 3;">
        <label>Min gj.snitt media-visninger</label><br/>
        <input id="minViewsMedia" type="number" value="0" style="width:140px;" />
      </div>

      <div style="grid-column: span 9; display:flex; gap:10px; align-items: end;">
        <button id="resetBtn" type="button">Nullstill filtre</button>
        <div id="stats" style="color:#555;"></div>
      </div>
    </div>

    <!-- Table -->
    <div style="overflow:auto;border:1px solid #e5e5e5;border-radius:6px;">
      <table style="width:100%;border-collapse:collapse;min-width:1200px;">
        <thead>
          <tr id="tableHead" style="background:#fafafa;position:sticky;top:0;"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div id="pagination"
         style="margin-top:12px;display:flex;gap:10px;align-items:center;"></div>
  </div>

  <script type="module" src="/js/arkiv.js"></script>
</body>

<script>
  fetch("../partials/navbar.html")
    .then(r => r.text())
    .then(html => document.getElementById("navbar").outerHTML = html);
</script>
</html>
