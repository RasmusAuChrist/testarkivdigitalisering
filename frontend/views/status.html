<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASK - Driftsstatus</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    table.status-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      color: white;
    }
    table.status-table th,
    table.status-table td {
      padding: 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    table.status-table th {
      background-color: #111;
    }
    .status-dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
  </style>
</head>
<body>
<div id="navbar"></div>
<main>
  <main>
    <h1>Driftsstatus</h1>
    <table class="status-table">
      <thead>
        <tr>
          <th>Status</th>
          <th>Tabell</th>
          <th>Last Loaded</th>
        </tr>
      </thead>
      <tbody id="status-body">
        <!-- Filled by JS -->
      </tbody>
    </table>
  </main>

  <script type="module" src="/js/status.js"></script>
</body>
<script>
  fetch("../partials/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").outerHTML = html;
    });
</script>

</html>
