<!DOCTYPE html>
<html lang="no">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASK - Hylleplasseringer</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <!-- Loading Spinner -->
  <div id="loadingOverlay">
    <img src="../assets/spinner.png" alt="Loading..." class="spinner" />
  </div>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>
  <link rel="stylesheet" href="/assets/navbar.css" />

  <!-- Filter Controls -->
  <div id="controls">
    <label for="depotSelect">Depot:</label>
    <select id="depotSelect"></select>

    <label for="roomSelect">Magasin:</label>
    <select id="roomSelect"></select>

    <label for="pathFilter">Filtrer på sti:</label>
    <input type="text" id="pathFilter" placeholder="f.eks. RA-S-2451/F" />
  </div>

  <!-- Canvas -->
  <canvas id="shelfCanvas" width="1600" height="1000"></canvas>

  <!-- Scripts -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="../js/location.js"></script>
</body>
<script>
  fetch("/partials/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar-container").innerHTML = html;
    });
</script>
</html>
