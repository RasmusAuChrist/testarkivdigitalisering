<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Arbeidsflyt – Ordre (detaljer)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/assets/navbar.css" />
</head>

<body>
  <!-- Navbar -->
  <div id="navbar-container"></div>

  <div class="surface-light" style="max-width: 1200px; margin: 18px auto; padding: 0 14px;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap: 12px;">
      <h2 style="margin: 12px 0;">Arbeidsflyt – ordre (detaljer)</h2>
<div id="userMenu" style="position:relative;">
  <button
    id="userMenuBtn"
    class="btn btn-outline"
    type="button"
    aria-haspopup="menu"
    aria-expanded="false"
    style="display:inline-flex; align-items:center; gap:8px;"
  >
    <span id="userMenuName" class="btn-text">Meny</span>
    <span aria-hidden="true" style="font-weight:900;">▾</span>
  </button>

  <div
    id="userMenuDropdown"
    role="menu"
    style="
      display:none;
      position:absolute;
      right:0;
      top:calc(100% + 8px);
      min-width:220px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:12px;
      box-shadow:0 12px 30px rgba(0,0,0,0.12);
      overflow:hidden;
      z-index:50;
    "
  >
    <a
      data-action="account"
      href="/views/account.html"
      role="menuitem"
      style="display:block; padding:10px 12px; color:#111827; text-decoration:none;"
      onmouseover="this.style.background='#f3f4f6'"
      onmouseout="this.style.background='transparent'"
    >
      Min konto
    </a>

    <div id="userMenuAdminItem" style="display:none;">
      <a
        href="/views/admin_users.html"
        role="menuitem"
        style="display:block; padding:10px 12px; color:#111827; text-decoration:none;"
        onmouseover="this.style.background='#f3f4f6'"
        onmouseout="this.style.background='transparent'"
      >
        Administrer brukere
      </a>
    </div>

    <div style="height:1px; background:#e5e7eb;"></div>

    <a
      id="userMenuLogout"
      href="#"
      role="menuitem"
      style="display:block; padding:10px 12px; color:#b91c1c; text-decoration:none; font-weight:700;"
      onmouseover="this.style.background='#fef2f2'"
      onmouseout="this.style.background='transparent'"
    >
      Logg ut
    </a>
  </div>
</div>      </button>
    </div>

    <div class="filters-dark dropdown-light" style="display:grid; gap: 10px;">
      <div style="display:flex; flex-wrap:wrap; gap: 10px; align-items:flex-end;">
        <div style="flex: 1; min-width: 320px;">
          <label for="amidInput">_amid (ExternalAmid)</label><br />
          <input id="amidInput" placeholder="340EEB8A-89CD-4D97-86D9-0127EF11DF72" style="width:100%;" />
        </div>

        <button id="loadBtn" class="btn btn-primary" type="button">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-text">Hent ordre</span>
        </button>
      </div>

      <div id="msg" style="color:#fff; opacity:0.9;"></div>
    </div>

    <!-- Header card -->
    <div id="headerCard" class="surface-light" style="margin-top: 14px; display:none;">
      <div style="background:#fff; border:1px solid #e5e7eb; border-radius: 10px; padding: 14px;">
        <h3 style="margin-bottom: 8px;">Oppsummering</h3>
        <div id="headerGrid" style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;"></div>
      </div>
    </div>

    <!-- Steps -->
    <div style="margin-top: 14px;">
      <h3>Steg</h3>
      <div class="table-scroll-x" style="margin-top: 8px;">
        <table class="arkiv-table" style="min-width: 1100px;">
          <thead>
            <tr>
              <th>#</th>
              <th>Steg</th>
              <th>Status</th>
              <th>Tildelt</th>
              <th>Startet</th>
              <th>Fullført</th>
              <th>Disposition</th>
              <th>Merknad</th>
            </tr>
          </thead>
          <tbody id="stepsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Events -->
    <div style="margin-top: 14px;">
      <h3>Hendelser</h3>
      <div class="table-scroll-x" style="margin-top: 8px;">
        <table class="arkiv-table" style="min-width: 1000px;">
          <thead>
            <tr>
              <th>Tid</th>
              <th>Type</th>
              <th>Steg</th>
              <th>Årsak</th>
              <th>Kommentar</th>
              <th>Bruker</th>
            </tr>
          </thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/js/workflow_order.js"></script>
</body>
</html>
