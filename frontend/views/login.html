<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>ASK – Logg inn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">

</head>
<body>

  <div style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  ">

    <div class="surface-light login-card">

      <img src="/assets/logo.png" style="height:60px;margin-bottom:16px;">

      <h2>Logg inn</h2>

      <p class="login-subtitle">
        Skriv inn brukernavn og passord.
      </p>

      <div class="login-form">

        <label>
          Brukernavn
          <input id="username" type="text" autocomplete="username"/>
        </label>

        <label>
          Passord
          <input id="password" type="password" autocomplete="current-password"/>
        </label>

        <label class="remember-row">
          <input id="rememberMe" type="checkbox" />
          Husk meg på denne maskinen
        </label>

        <button id="loginBtn" class="btn btn-primary" type="button">
          Logg inn
        </button>

        <div id="err" class="login-error"></div>

      </div>

    </div>

  </div>

  <script type="module" src="/js/login.js"></script>
</body></html>
