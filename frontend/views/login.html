<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>ASK – Logg inn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="surface-light" style="padding:20px;max-width:520px;margin:0 auto;">
    <h2>Logg inn</h2>
    <p style="color:#555;margin-top:-6px;">
      Skriv inn brukernavn og passord.
    </p>

    <div style="display:grid;gap:10px;margin-top:16px;">
      <label>
        Brukernavn
        <input id="username" type="text" autocomplete="username" style="width:100%;" />
      </label>

      <label>
        Passord
        <input id="password" type="password" autocomplete="current-password" style="width:100%;" />
      </label>

      <label style="display:flex; align-items:center; gap:8px;">
       <input id="rememberMe" type="checkbox" />
        Husk meg på denne maskinen
      </label>      

      <button id="loginBtn" type="button">Logg inn</button>

      <div id="err" style="color:#b00020;display:none;"></div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
