<!DOCTYPE html>
<html lang="no">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASK - SAH oversikt</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="/assets/navbar.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 64px;
      height: 64px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .page-container {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .page-title {
      margin: 0 0 18px;
      font-size: 28px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .controls label {
      font-weight: 600;
    }

    .controls select,
    .controls input {
      min-width: 260px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .summary {
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }

    .table-wrapper {
      background: #fff;
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    thead {
      background: #1f4e79;
      color: white;
    }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }

    tbody tr:hover {
      background: #f4f8fc;
    }

    .empty-state,
    .error-state {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .asta-link {
      color: #1f4e79;
      text-decoration: none;
      word-break: break-word;
    }

    .asta-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <img src="../assets/spinner.png" alt="Loading..." class="spinner" />
  </div>

  <div id="navbar-container"></div>

  <div class="page-container">
    <h1 class="page-title">SAH – arkivoversikt</h1>

    <div class="controls">
      <label for="arkivFilter">Filtrer på arkiv_navn:</label>
      <select id="arkivFilter">
        <option value="">Alle</option>
      </select>

      <input
        type="text"
        id="searchInput"
        placeholder="Søk i arkiv_identifikator, arkiv_navn eller asta_sti"
      />
    </div>

    <div id="summary" class="summary">Laster data...</div>

    <div id="content"></div>
  </div>

  <script type="module" src="../js/sah_items.js"></script>
  <script>
    fetch("/partials/navbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("navbar-container").innerHTML = html;
      });
  </script>
</body>
</html>
