<!DOCTYPE html>
<html lang="no">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASK - SAH flytteoversikt</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="/assets/navbar.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 64px;
      height: 64px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .page-container {
      padding: 24px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-subtitle {
      margin: 0 0 18px;
      color: #666;
      font-size: 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .summary-card-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .summary-card-value {
      font-size: 28px;
      font-weight: 700;
    }

    .summary-card-value.total { color: #1f4e79; }
    .summary-card-value.moved { color: #188038; }
    .summary-card-value.not-moved { color: #b26a00; }
    .summary-card-value.deviation { color: #c5221f; }

    .progress-panel {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 24px;
      background: #e5e5e5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #188038, #34a853);
      transition: width 0.25s ease;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .controls label {
      font-weight: 600;
    }

    .controls select,
    .controls input,
    .controls button {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background: white;
    }

    .status-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-btn {
      min-width: auto;
      cursor: pointer;
    }

    .status-btn.active {
      background: #1f4e79;
      color: white;
      border-color: #1f4e79;
    }

    .summary {
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }

    .table-wrapper {
      background: #fff;
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1200px;
    }

    thead {
      background: #1f4e79;
      color: white;
    }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }

    tbody tr:hover {
      background: #f4f8fc;
    }

    .empty-state,
    .error-state {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .asta-link {
      color: #1f4e79;
      text-decoration: none;
      word-break: break-word;
    }

    .asta-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge.flyttet {
      background: #e6f4ea;
      color: #188038;
    }

    .badge.ikke_flyttet {
      background: #fef7e0;
      color: #b26a00;
    }

    .badge.avvik {
      background: #fce8e6;
      color: #c5221f;
    }

    .pagination {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .pagination button {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <img src="../assets/spinner.png" alt="Loading..." class="spinner" />
  </div>

  <div id="navbar-container"></div>

  <div class="page-container">
    <h1 class="page-title">SAH – flytteoversikt</h1>
    <p class="page-subtitle">
      Viser alle stykker der lokasjon = SAH, og klassifiserer dem som flyttet, ikke flyttet eller avvik.
    </p>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-card-title">Totalt antall</div>
        <div id="totalItemsValue" class="summary-card-value total">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-title">Flyttet korrekt</div>
        <div id="movedItemsValue" class="summary-card-value moved">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-title">Ikke flyttet</div>
        <div id="notMovedItemsValue" class="summary-card-value not-moved">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-title">Avvik</div>
        <div id="deviationItemsValue" class="summary-card-value deviation">0</div>
      </div>
    </div>

    <div class="progress-panel">
      <div class="progress-header">
        <span>Fremdrift</span>
        <span id="progressLabel">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div class="controls">
      <label for="arkivFilter">Arkiv:</label>
      <select id="arkivFilter">
        <option value="">Alle</option>
      </select>

      <label for="searchInput">Søk:</label>
      <input
        type="text"
        id="searchInput"
        placeholder="Søk i stykke, arkiv, asta_sti eller hylleplassering"
      />

      <div class="status-buttons">
        <button class="status-btn active" data-status="">Alle</button>
        <button class="status-btn" data-status="flyttet">Flyttet</button>
        <button class="status-btn" data-status="ikke_flyttet">Ikke flyttet</button>
        <button class="status-btn" data-status="avvik">Avvik</button>
      </div>
    </div>

    <div id="summary" class="summary">Laster data...</div>

    <div id="content"></div>
  </div>

  <script type="module" src="../js/sah_items.js"></script>
  <script>
    fetch("/partials/navbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("navbar-container").innerHTML = html;
      });
  </script>
</body>
</html>
