<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Arbeidsflyt – Stegkø</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/assets/navbar.css" /></head>
<body>
  <div id="navbar-container"></div>

  <div class="surface-light" style="max-width: 1200px; margin: 18px auto; padding: 0 14px;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap: 12px;">
      <h2 style="margin: 12px 0;">Stegkø</h2>
      <button id="logoutBtn" class="btn btn-outline" type="button">
        <span class="btn-text">Logg ut</span>
      </button>
    </div>

    <div class="filters-dark dropdown-light" style="display:grid; gap: 10px;">
      <div style="display:flex; flex-wrap:wrap; gap: 10px; align-items:flex-end;">
        <div style="min-width: 320px;">
          <label for="stepSelect">Velg steg</label><br />
          <select id="stepSelect" style="width:100%;"></select>
        </div>

        <button id="refreshBtn" class="btn btn-primary" type="button">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-text">Oppdater</span>
        </button>

        <div id="countBox" style="margin-left:auto; color:#fff; opacity:0.9;"></div>
      </div>

      <div id="msg" style="color:#fff; opacity:0.9;"></div>
    </div>

    <div style="margin-top: 14px;">
      <div class="table-scroll-x">
        <table class="arkiv-table" style="min-width: 1400px;">
          <thead>
            <tr>
              <th>Prioritet</th>
              <th>OrdreId</th>
              <th>Batch</th>
              <th>Tittel</th>
              <th>Stegstatus</th>
              <th>Tildelt</th>
              <th>Startet</th>
              <th>_amid</th>
              <th>Detaljer</th>
              <th>Kontroller</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/js/workflow_queue.js"></script>
</body>
</html>
