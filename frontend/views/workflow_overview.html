<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Arbeidsflyt – Oversikt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/assets/navbar.css" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
</head>

<body>
  <div id="navbar-container"></div>

  <div class="surface-light" style="max-width: 1500px; margin: 18px auto; padding: 0 14px;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <h2 style="margin: 12px 0;">Arbeidsflyt – oversikt</h2>
   </div>

    <div class="filters-dark" style="display:grid; gap:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div>
          <div style="color:#fdd835; font-weight:800;">Pipeline-status</div>
          <div style="color:#fff; opacity:0.85; font-size:13px;">
            Oversikt over antall aktive arbeidsflyt-elementer per steg.
          </div>
        </div>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <a class="btn btn-outline" href="/views/workflow_queue.html">
            Åpne stegkø
          </a>

          <button id="refreshBtn" class="btn btn-primary" type="button">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Oppdater</span>
          </button>
        </div>
      </div>

      <div id="msg" style="color:#fff; opacity:0.9;"></div>
    </div>

    <div style="margin-top:14px; display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:12px;">
      <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px;">
        <div style="font-size:12px; color:#6b7280;">Totalt i kø</div>
        <div id="totalCount" style="font-size:30px; font-weight:900;">–</div>
      </div>

      <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px;">
        <div style="font-size:12px; color:#6b7280;">Aktive</div>
        <div id="activeCount" style="font-size:30px; font-weight:900;">–</div>
      </div>

      <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px;">
        <div style="font-size:12px; color:#6b7280;">Ikke påbegynt</div>
        <div id="pendingCount" style="font-size:30px; font-weight:900;">–</div>
      </div>

      <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px;">
        <div style="font-size:12px; color:#6b7280;">Blokkert / på vent / stoppet</div>
        <div id="blockedHoldCount" style="font-size:30px; font-weight:900;">–</div>
      </div>
    </div>

    <div style="margin-top:14px;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div>
          <h3 style="margin:0;">Stegoversikt</h3>
          <div style="font-size:13px; color:#6b7280; margin-top:4px;">
            Mørkere/varmere farge betyr flere elementer i steget.
          </div>
        </div>

        <div style="display:flex; gap:10px; align-items:center; font-size:12px; color:#6b7280; flex-wrap:wrap;">
          <span>Lav belastning</span>
          <span style="display:inline-block; width:24px; height:12px; border-radius:999px; background:#f1f5f9; border:1px solid #e5e7eb;"></span>
          <span style="display:inline-block; width:24px; height:12px; border-radius:999px; background:#fef9c3; border:1px solid #e5e7eb;"></span>
          <span style="display:inline-block; width:24px; height:12px; border-radius:999px; background:#fde68a; border:1px solid #e5e7eb;"></span>
          <span style="display:inline-block; width:24px; height:12px; border-radius:999px; background:#fdba74; border:1px solid #e5e7eb;"></span>
          <span style="display:inline-block; width:24px; height:12px; border-radius:999px; background:#fca5a5; border:1px solid #e5e7eb;"></span>
          <span>Mulig flaskehals</span>
        </div>
      </div>

      <div id="overviewGrid" class="workflow-overview-grid"></div>
    </div>
  </div>

  <script type="module" src="/js/workflow_overview.js"></script>
</body>
</html>
