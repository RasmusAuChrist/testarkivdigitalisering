<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shelf Visualization</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
    }

    #controls {
      display: flex;
      gap: 10px;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 5px 10px;
      border-radius: 5px;
      align-items: center;
    }

#controls label,
#controls select {
  font-size: 16px;
}

    canvas {
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="depotSelect">Depot:</label>
    <select id="depotSelect"></select>

    <label for="roomSelect">Room:</label>
    <select id="roomSelect"></select>
  </div>

  <canvas id="shelfCanvas" width="1600" height="1000"></canvas>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
