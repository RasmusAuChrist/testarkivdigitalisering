<!DOCTYPE html>
<html lang="no">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASK - Hovedside</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="/assets/logo.png" class="splash-logo" alt="ASK Logo">
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>
  <link rel="stylesheet" href="/assets/navbar.css" />

  <!-- Main content -->
  <div id="main-content" style="display: none;">
    <main>
      <h1>Velkommen til ASK</h1>
      <p>Bruk menyen øverst til å navigere</p>

      <section id="dashboard-grid">
        <div class="chart-box">
          <h3>Hyllemeter per steg</h3>
          <div class="chart-canvas-wrap is-loading" aria-busy="true">
            <canvas id="statusChart"></canvas>
            <div class="chart-loading" aria-hidden="true">
              <img src="/assets/spinner.png" alt="" class="spinner" />
            </div>
          </div>
        </div>

        <div class="chart-box">
          <h3>Flytting Hamar</h3>
          <div class="chart-canvas-wrap is-loading" aria-busy="true">
            <canvas id="chart2"></canvas>
            <div class="chart-loading" aria-hidden="true">
              <img src="/assets/spinner.png" alt="" class="spinner" />
            </div>
          </div>
        </div>

        <div class="chart-box">
          <h3>Chart 3</h3>
          <canvas id="chart3"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 4</h3>
          <canvas id="chart4"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 5</h3>
          <canvas id="chart5"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 6</h3>
          <canvas id="chart6"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/main.js" type="module"></script>
