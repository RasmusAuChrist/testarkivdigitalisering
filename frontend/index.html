<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASK - Hovedside</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="/assets/logo.png" class="splash-logo" alt="ASK Logo">
  </div>

  <!-- Navbar -->
  <div id="navbar">
  </div>

  <!-- Main content -->
<main>
  <h1>Velkommen til ASK</h1>
  <p>Bruk menyen øverst til å navigere</p>

  <section style="margin-top: 40px;">
    <h2>Statusfordeling</h2>
    <canvas id="statusChart" width="400" height="300"></canvas>
  </section>
</main>

  <script src="/js/main.js" type="module"></script>

<script>
  fetch("/partials/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").outerHTML = html;
    });
</script>

</html>
