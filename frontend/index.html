<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASK - Hovedside</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="/assets/logo.png" class="splash-logo" alt="ASK Logo">
  </div>

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main content -->
  <div id="main-content" style="display: none;">
    <main>
      <h1>Velkommen til ASK</h1>
      <p>Bruk menyen øverst til å navigere</p>

      <section id="dashboard-grid">
        <div class="chart-box">
          <h3>Statusfordeling</h3>
          <canvas id="statusChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 2</h3>
          <canvas id="chart2"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 3</h3>
          <canvas id="chart3"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 4</h3>
          <canvas id="chart4"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 5</h3>
          <canvas id="chart5"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 6</h3>
          <canvas id="chart6"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/main.js" type="module"></script>

  <script>
    fetch("/partials/navbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("navbar").outerHTML = html;
      });
  </script>
</body>
</html>
