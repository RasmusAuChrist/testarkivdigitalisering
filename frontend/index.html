<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shelf Visualization</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
    }

    #roomSelect {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 5px;
      font-size: 16px;
    }

    canvas {
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <select id="roomSelect"></select>
  <canvas id="shelfCanvas" width="1600" height="1000"></canvas>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
