<!DOCTYPE html>
<html lang="no">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASK - Hovedside</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="/assets/logo.png" class="splash-logo" alt="ASK Logo">
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>
  <link rel="stylesheet" href="/assets/navbar.css" />

  <div id="userMenu" style="position:relative;">
  <button
    id="userMenuBtn"
    class="btn btn-outline"
    type="button"
    aria-haspopup="menu"
    aria-expanded="false"
  >
    <span id="userMenuName">Meny</span>
    <span aria-hidden="true">▾</span>
  </button>

  <div id="userMenuDropdown" role="menu" style="display:none; position:absolute; right:0; top:100%; background:#fff; border:1px solid #ddd; border-radius:10px; z-index:50;">
    <a data-action="account" href="/views/account.html" role="menuitem">Min konto</a>

    <div id="userMenuAdminItem" style="display:none;">
      <a href="/views/admin_users.html" role="menuitem">Administrer brukere</a>
    </div>

    <a id="userMenuLogout" href="#" role="menuitem">Logg ut</a>
  </div>
</div>

  <!-- Main content -->
  <div id="main-content" style="display: none;">
    <main>
      <h1>Velkommen til ASK</h1>
      <p>Bruk menyen øverst til å navigere</p>

      <section id="dashboard-grid">
        <div class="chart-box">
          <h3>Statusfordeling</h3>
          <canvas id="statusChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 2</h3>
          <canvas id="chart2"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 3</h3>
          <canvas id="chart3"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 4</h3>
          <canvas id="chart4"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 5</h3>
          <canvas id="chart5"></canvas>
        </div>

        <div class="chart-box">
          <h3>Chart 6</h3>
          <canvas id="chart6"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/main.js" type="module"></script>
